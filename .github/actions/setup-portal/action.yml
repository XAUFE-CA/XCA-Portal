name: Set up portal
description: Install the frozen portal and shared UI dependencies
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: SSJ-ZYJ/Neoverse-UI
        ref: 63a48789f6b65fa44aea22e4189015232d3961b6
        path: Neoverse-UI
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version-file: XCA-Portal/.node-version
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
    - name: Install shared workspace
      shell: bash
      working-directory: Neoverse-UI
      run: bun install --frozen-lockfile --linker hoisted
    - name: Install portal
      shell: bash
      working-directory: XCA-Portal
      run: bun install --frozen-lockfile --linker hoisted
    - name: Sync shared UI
      shell: bash
      working-directory: XCA-Portal
      run: bun run ui:sync
