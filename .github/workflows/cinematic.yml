name: Cinematic
on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard index (1-3)"
        default: "1"

permissions:
  contents: read
concurrency:
  group: cinematic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-scene:
    # The full intro needs a GPU. Hosted runners fall back to software rendering and cannot
    # validate these cases, so this workflow is manual and its result is not acceptance.
    # Trigger it only on a self-hosted GPU runner; otherwise use local `bun run test:scene`.
    # 完整入场需要 GPU。托管运行器使用软件渲染，无法验证这些用例；本工作流手动触发，结果不作为验收依据。
    # 仅在自托管 GPU 运行器上触发，否则使用本地 `bun run test:scene`。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      # Early development only: published dependencies need no sibling checkout.
      # 仅早期开发需要：发布版本无需联合检出。
      - uses: actions/checkout@v7
        with:
          repository: SSJ-ZYJ/Neoverse-UI
          ref: 35a0b34b79e922c383b6a145fff1c0e7c1f393c7
          path: Neoverse-UI
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
      - name: Install shared workspace
        working-directory: Neoverse-UI
        run: bun install --frozen-lockfile --linker hoisted
      - name: Install portal
        run: bun install --frozen-lockfile --linker hoisted
      # Early development only; published dependencies need no sync.
      # 仅早期开发需要；发布版本无需同步。
      - name: Sync shared UI
        run: bun run ui:sync
      - name: Production build
        run: bunx nuxt build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Full-scene regression
        run: bun run test:scene:ci -- --shard=${{ inputs.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cinematic-results
          path: XCA-Portal/test-results
          if-no-files-found: ignore
