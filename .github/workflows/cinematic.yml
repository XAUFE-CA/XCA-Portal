name: Cinematic
on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard index (1-3)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"

permissions:
  contents: read
concurrency:
  group: cinematic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-scene:
    # The full intro needs a GPU. Hosted runners fall back to software rendering and cannot
    # validate these cases, so this workflow is manual and its result is not acceptance.
    # Trigger it only on a self-hosted GPU runner; otherwise use local `bun run test:scene`.
    # 完整入场需要 GPU。托管运行器使用软件渲染，无法验证这些用例；本工作流手动触发，结果不作为验收依据。
    # 仅在自托管 GPU 运行器上触发，否则使用本地 `bun run test:scene`。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      - uses: ./XCA-Portal/.github/actions/setup-portal
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Full-scene regression
        env:
          SCENE_SHARD: ${{ inputs.shard }}
        run: bun run test:scene:ci -- --shard="$SCENE_SHARD"/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cinematic-results
          path: XCA-Portal/test-results
          if-no-files-found: ignore
