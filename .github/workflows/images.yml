name: Images
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Rewrite the baselines instead of comparing them"
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    # Baselines belong to the machine that renders them, so this runs on demand and never
    # gates a push; the functional suite on Linux stays the blocking regression.
    # 基线属于渲染它的机器，因此按需运行、不阻断推送；Linux 上的功能套件仍是阻断性回归。
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      # Early development only: published dependencies need no sibling checkout.
      # 仅早期开发需要：发布版本无需联合检出。
      - uses: actions/checkout@v7
        with:
          repository: SSJ-ZYJ/Neoverse-UI
          ref: e0d2005b6288900061f745020ef90fc0a5a3dac9
          path: Neoverse-UI
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
      - name: Install shared workspace
        working-directory: Neoverse-UI
        run: bun install --frozen-lockfile --linker hoisted
      - name: Install portal
        run: bun install --frozen-lockfile --linker hoisted
      # Early development only; published dependencies need no sync.
      # 仅早期开发需要；发布版本无需同步。
      - name: Sync shared UI
        run: bun run ui:sync
      - name: Production build
        run: bunx nuxt build
      - name: Compare baselines
        if: ${{ !inputs.update }}
        run: bun scripts/tests/test-plan.ts run system --snapshot
      - name: Rewrite baselines
        if: ${{ inputs.update }}
        run: bun scripts/tests/test-plan.ts run system --snapshot --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-images
          path: |
            XCA-Portal/test-results
            XCA-Portal/tests/e2e/visual/terminal-visual-acceptance.spec.ts-snapshots
          if-no-files-found: ignore
