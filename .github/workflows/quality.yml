name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates and the production build run once; browser jobs reuse the artifact.
  # 门禁与生产构建只运行一次，浏览器作业复用其产物。
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      # Early development only: published dependencies need no sibling checkout.
      # 仅早期开发需要：发布版本无需联合检出。
      - uses: actions/checkout@v7
        with:
          repository: SSJ-ZYJ/Neoverse-UI
          ref: e0d2005b6288900061f745020ef90fc0a5a3dac9
          path: Neoverse-UI
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
      - name: Install shared workspace
        working-directory: Neoverse-UI
        run: bun install --frozen-lockfile --linker hoisted
      - name: Install portal
        run: bun install --frozen-lockfile --linker hoisted
      # Early development only; published dependencies need no sync.
      # 仅早期开发需要；发布版本无需同步。
      - name: Sync shared UI
        run: bun run ui:sync
      - name: Fast gates
        run: bun run check:fast
      - name: Production build
        run: bunx nuxt build
      - uses: actions/upload-artifact@v7
        with:
          name: portal-build
          # The build output is a dot-directory, which the action excludes by default.
          # 构建产物是点开头的目录，该动作默认会跳过隐藏文件。
          path: XCA-Portal/.output
          include-hidden-files: true
          retention-days: 1

  # Hosted runners render the cinematic intro without a GPU, so functional coverage is
  # split across shards. Image baselines depend on the rasterizer of the machine that owns
  # them, so they run in the separate images workflow instead of gating every push.
  # 托管运行器没有 GPU 渲染影院式入场，因此功能覆盖按分片切分。
  # 图片基线取决于其所在机器的光栅器，因此改在独立的 images 工作流运行，不阻断每次推送。
  browser:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1
          - os: ubuntu-latest
            shard: 2
          - os: ubuntu-latest
            shard: 3
          - os: ubuntu-latest
            shard: 4
          - os: ubuntu-latest
            shard: 5
          - os: ubuntu-latest
            shard: 6
          - os: ubuntu-latest
            shard: 7
          - os: ubuntu-latest
            shard: 8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      # Early development only: published dependencies need no sibling checkout.
      # 仅早期开发需要：发布版本无需联合检出。
      - uses: actions/checkout@v7
        with:
          repository: SSJ-ZYJ/Neoverse-UI
          ref: e0d2005b6288900061f745020ef90fc0a5a3dac9
          path: Neoverse-UI
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
      - name: Install shared workspace
        working-directory: Neoverse-UI
        run: bun install --frozen-lockfile --linker hoisted
      - name: Install portal
        run: bun install --frozen-lockfile --linker hoisted
      # Early development only; published dependencies need no sync.
      # 仅早期开发需要；发布版本无需同步。
      - name: Sync shared UI
        run: bun run ui:sync
      - uses: actions/download-artifact@v7
        with:
          name: portal-build
          path: XCA-Portal/.output
      # Browser binaries do not depend on the portal build, so every shard reuses one cache.
      # 浏览器二进制不依赖门户构建，各分片复用同一缓存。
      - uses: actions/cache@v6
        with:
          path: "~/.cache/ms-playwright"
          key: playwright-${{ runner.os }}-${{ hashFiles('XCA-Portal/bun.lock') }}
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Functional browser regression (Linux)
        if: runner.os == 'Linux'
        # Snapshot baselines stay in the separate images workflow; the functional plan excludes that scope.
        # 图片基线由独立的 images 工作流负责，功能计划不选择该范围。
        # Full-scene geometry runs in the cinematic workflow; a slow renderer cannot host it.
        # 完整场景几何由 cinematic 工作流承担；慢速渲染器跑不动它。
        run: bun scripts/test-plan.ts run system --no-snapshot --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ runner.os }}-${{ matrix.shard }}
          path: XCA-Portal/test-results
          if-no-files-found: ignore
