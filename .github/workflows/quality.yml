name: Quality
on:
  # Directory-level patterns only: process notes and prose docs change neither the built site
  # nor gate inputs. docs/testing/** stays in scope because its README is the test registry;
  # .github/, content/ and every runtime path are never ignored.
  # 仅用目录级模式：过程记录与叙述文档不改变构建产物，也不是门禁输入。docs/testing/ 下的
  # README 是测试注册表，故该目录保持触发；.github/、content/ 与所有运行时路径均不忽略。
  pull_request:
    paths-ignore:
      - ".agents/**"
      - "docs/adr/**"
      - "docs/architecture/**"
      - "docs/terminology/**"
      - "docs/*.md"
      - "*.md"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - "docs/adr/**"
      - "docs/architecture/**"
      - "docs/terminology/**"
      - "docs/*.md"
      - "*.md"
      - "LICENSE*"
  # Manual runs ignore path filters and can verify documentation-only pushes on demand.
  # 手动触发不受路径过滤限制，可按需验证仅含文档的推送。
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend checks run independently of the portal build and browser shards.
  # 后端检查独立于门户构建和浏览器分片运行。
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Go checks and race tests
        run: bun tools/check.mjs -race
      - name: Install contract tools
        run: bun install --frozen-lockfile
      - name: Validate API contract and generated types
        working-directory: .
        run: bun run backend:api:check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: PostgreSQL and Mailpit integration tests
        run: bun --cwd=backend test:integration

  backend-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build API, migration and invitation binaries
        run: bun --cwd=backend run build
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
      - name: Archive Go candidate binaries
        run: tar -czf backend.tar.gz -C backend bin
      - uses: actions/upload-artifact@v7
        with:
          name: backend-candidate-${{ runner.os }}
          path: backend.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Frontend gates include type checks and isolated unit/module tests without building Nitro.
  # 前端门禁包含类型检查与隔离的单元及模块测试，不构建 Nitro。
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      - uses: ./XCA-Portal/.github/actions/setup-portal
      - name: Fast gates
        run: bun run check:fast

  portal-build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      - uses: ./XCA-Portal/.github/actions/setup-portal
      - name: Build Node production output
        run: bun run build
      - name: Archive Nitro candidate
        run: tar -czf portal.tar.gz .output
      - uses: actions/upload-artifact@v7
        with:
          name: portal-candidate-${{ runner.os }}
          path: XCA-Portal/portal.tar.gz
          if-no-files-found: error
          retention-days: 7

  portal-smoke:
    needs: portal-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v7
        with:
          name: portal-candidate-${{ runner.os }}
          path: ${{ runner.temp }}
      - name: Extract candidate without installing dependencies
        working-directory: ${{ runner.temp }}
        run: tar -xzf portal.tar.gz
      - name: Check standalone Nitro runtime
        shell: bash
        run: node scripts/build/smoke-nitro.mjs "$RUNNER_TEMP/.output"

  auth-browser:
    needs: [portal-smoke, backend-build]
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, "browser:passkey"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      - uses: ./XCA-Portal/.github/actions/setup-portal
      - uses: actions/download-artifact@v7
        with:
          name: portal-candidate-Linux
          path: XCA-Portal
      - uses: actions/download-artifact@v7
        with:
          name: backend-candidate-Linux
          path: XCA-Portal
      - name: Extract release candidates
        run: |
          tar -xzf portal.tar.gz
          tar -xzf backend.tar.gz -C backend
      - name: Install Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      - name: Isolated auth browser suite
        env:
          AUTH_SUITE: ${{ matrix.suite }}
        run: bun --cwd=backend "test:$AUTH_SUITE" --artifacts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: auth-browser-${{ strategy.job-index }}
          path: XCA-Portal/test-results
          if-no-files-found: ignore
          retention-days: 3

  # The push gate runs only GPU-independent functional assertions; @cinematic cases need
  # WebGL and are verified locally on a GPU machine. Coverage is split across shards.
  # Image baselines depend on the rasterizer of the machine that owns them, so they run
  # in the separate images workflow instead of gating every push.
  # 推送门禁只运行不依赖 GPU 的功能断言；@cinematic 用例需要 WebGL，由具备 GPU 的本地环境验收。
  # 功能覆盖按分片切分。图片基线取决于其所在机器的光栅器，改在独立的 images 工作流运行。
  browser:
    needs: portal-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1
          - os: ubuntu-latest
            shard: 2
          - os: ubuntu-latest
            shard: 3
          - os: ubuntu-latest
            shard: 4
          - os: ubuntu-latest
            shard: 5
          - os: ubuntu-latest
            shard: 6
          - os: ubuntu-latest
            shard: 7
          - os: ubuntu-latest
            shard: 8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      - uses: ./XCA-Portal/.github/actions/setup-portal
      - uses: actions/download-artifact@v7
        with:
          name: portal-candidate-Linux
          path: XCA-Portal
      - name: Extract Nitro candidate
        run: tar -xzf portal.tar.gz
      # Browser binaries do not depend on the portal build, so every shard reuses one cache.
      # 浏览器二进制不依赖门户构建，各分片复用同一缓存。
      - uses: actions/cache@v6
        with:
          path: "~/.cache/ms-playwright"
          key: playwright-${{ runner.os }}-${{ hashFiles('XCA-Portal/bun.lock') }}
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: bunx --no-install playwright install --with-deps chromium
      - name: Functional browser regression (Linux)
        if: runner.os == 'Linux'
        # Snapshot baselines stay in the separate images workflow; the functional plan excludes that scope.
        # 图片基线由独立的 images 工作流负责，功能计划不选择该范围。
        # Full-scene geometry runs in the cinematic workflow; a slow renderer cannot host it.
        # 完整场景几何由 cinematic 工作流承担；慢速渲染器跑不动它。
        run: bun run test:ci -- --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ runner.os }}-${{ matrix.shard }}
          path: XCA-Portal/test-results
          if-no-files-found: ignore
          retention-days: 3
