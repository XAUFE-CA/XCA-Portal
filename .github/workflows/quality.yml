name: Quality
on:
  # Directory-level patterns only: process notes and prose docs change neither the built site
  # nor gate inputs. docs/testing/** stays in scope because its README is the test registry;
  # .github/, content/ and every runtime path are never ignored.
  # 仅用目录级模式：过程记录与叙述文档不改变构建产物，也不是门禁输入。docs/testing/ 下的
  # README 是测试注册表，故该目录保持触发；.github/、content/ 与所有运行时路径均不忽略。
  pull_request:
    paths-ignore:
      - ".agents/**"
      - "docs/adr/**"
      - "docs/architecture/**"
      - "docs/terminology/**"
      - "docs/*.md"
      - "*.md"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - "docs/adr/**"
      - "docs/architecture/**"
      - "docs/terminology/**"
      - "docs/*.md"
      - "*.md"
      - "LICENSE*"
  # Manual runs ignore path filters and can verify documentation-only pushes on demand.
  # 手动触发不受路径过滤限制，可按需验证仅含文档的推送。
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend checks run independently of the portal build and browser shards.
  # 后端检查独立于门户构建和浏览器分片运行。
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Go checks and race tests
        run: bun tools/check.mjs -race
      - name: Install contract tools
        run: bun install --frozen-lockfile
      - name: Validate API contract and generated types
        working-directory: .
        run: bun run backend:api:check

  # Gates and the production build run once; browser jobs reuse the artifact.
  # 门禁与生产构建只运行一次，浏览器作业复用其产物。
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      # Early development only: published dependencies need no sibling checkout.
      # 仅早期开发需要：发布版本无需联合检出。
      - uses: actions/checkout@v7
        with:
          repository: SSJ-ZYJ/Neoverse-UI
          ref: c993f56c972073c85392c010b6a8f8199d442784
          path: Neoverse-UI
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
      - name: Install shared workspace
        working-directory: Neoverse-UI
        run: bun install --frozen-lockfile --linker hoisted
      - name: Install portal
        run: bun install --frozen-lockfile --linker hoisted
      # Early development only; published dependencies need no sync.
      # 仅早期开发需要；发布版本无需同步。
      - name: Sync shared UI
        run: bun run ui:sync
      - name: Fast gates
        run: bun run check:fast
      - name: Production build
        run: bunx nuxt build
      - uses: actions/upload-artifact@v7
        with:
          name: portal-build
          # The build output is a dot-directory, which the action excludes by default.
          # 构建产物是点开头的目录，该动作默认会跳过隐藏文件。
          path: XCA-Portal/.output
          include-hidden-files: true
          retention-days: 1

  # The push gate runs only GPU-independent functional assertions; @cinematic cases need
  # WebGL and are verified locally on a GPU machine. Coverage is split across shards.
  # Image baselines depend on the rasterizer of the machine that owns them, so they run
  # in the separate images workflow instead of gating every push.
  # 推送门禁只运行不依赖 GPU 的功能断言；@cinematic 用例需要 WebGL，由具备 GPU 的本地环境验收。
  # 功能覆盖按分片切分。图片基线取决于其所在机器的光栅器，改在独立的 images 工作流运行。
  browser:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1
          - os: ubuntu-latest
            shard: 2
          - os: ubuntu-latest
            shard: 3
          - os: ubuntu-latest
            shard: 4
          - os: ubuntu-latest
            shard: 5
          - os: ubuntu-latest
            shard: 6
          - os: ubuntu-latest
            shard: 7
          - os: ubuntu-latest
            shard: 8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v7
        with:
          path: XCA-Portal
          persist-credentials: false
      # Early development only: published dependencies need no sibling checkout.
      # 仅早期开发需要：发布版本无需联合检出。
      - uses: actions/checkout@v7
        with:
          repository: SSJ-ZYJ/Neoverse-UI
          ref: c993f56c972073c85392c010b6a8f8199d442784
          path: Neoverse-UI
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
      - name: Install shared workspace
        working-directory: Neoverse-UI
        run: bun install --frozen-lockfile --linker hoisted
      - name: Install portal
        run: bun install --frozen-lockfile --linker hoisted
      # Early development only; published dependencies need no sync.
      # 仅早期开发需要；发布版本无需同步。
      - name: Sync shared UI
        run: bun run ui:sync
      - uses: actions/download-artifact@v7
        with:
          name: portal-build
          path: XCA-Portal/.output
      # Browser binaries do not depend on the portal build, so every shard reuses one cache.
      # 浏览器二进制不依赖门户构建，各分片复用同一缓存。
      - uses: actions/cache@v6
        with:
          path: "~/.cache/ms-playwright"
          key: playwright-${{ runner.os }}-${{ hashFiles('XCA-Portal/bun.lock') }}
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Functional browser regression (Linux)
        if: runner.os == 'Linux'
        # Snapshot baselines stay in the separate images workflow; the functional plan excludes that scope.
        # 图片基线由独立的 images 工作流负责，功能计划不选择该范围。
        # Full-scene geometry runs in the cinematic workflow; a slow renderer cannot host it.
        # 完整场景几何由 cinematic 工作流承担；慢速渲染器跑不动它。
        run: bun run test:ci -- --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ runner.os }}-${{ matrix.shard }}
          path: XCA-Portal/test-results
          if-no-files-found: ignore
