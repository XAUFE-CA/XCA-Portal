name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: XCA-Portal
    steps:
      - uses: actions/checkout@v4
        with:
          path: XCA-Portal
          persist-credentials: false
      # Early development only: published dependencies need no sibling checkout.
      # 仅早期开发需要：发布版本无需联合检出。
      - uses: actions/checkout@v4
        with:
          repository: SSJ-ZYJ/Neoverse-UI
          ref: d4238c726d695abebef5f283d5520f8bd9a2cd60
          path: Neoverse-UI
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('XCA-Portal/bun.lock', 'Neoverse-UI/bun.lock') }}
      - name: Install shared workspace
        working-directory: Neoverse-UI
        run: bun install --frozen-lockfile --linker hoisted
      - name: Install portal
        run: bun install --frozen-lockfile --linker hoisted
      # Early development only; published dependencies need no sync.
      # 仅早期开发需要；发布版本无需同步。
      - name: Sync shared UI
        run: bun run ui:sync
      - name: Fast gates
        run: bun run check:fast
      - name: Production build
        run: bunx nuxt build
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Functional browser regression (Linux)
        if: runner.os == 'Linux'
        # Existing image baselines are Windows-only. All functional assertions still run.
        # 现有图片基线仅限 Windows；所有功能断言仍会运行。
        run: bunx playwright test --ignore-snapshots
      - name: Browser and existing image regression (Windows)
        if: runner.os == 'Windows'
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ runner.os }}
          path: XCA-Portal/test-results
          if-no-files-found: ignore
